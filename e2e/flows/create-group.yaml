appId: dev.andirayka.offledger
name: create-group
tags:
  - groups
---
- runFlow: ../subflows/open-app.yaml
- assertVisible: No groups yet
- tapOn:
    id: group-name-input
- inputText: Bali trip
- tapOn:
    id: create-group
- assertVisible: Bali trip
- stopApp
- openLink: ${OPEN_URL}
# Same cold-start allowance as open-app.yaml: the dev client re-fetches the bundle on every launch.
- extendedWaitUntil:
    visible: Bali trip
    timeout: 60000
